<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>

<nav class="navbar bg-transparent p-3">
    <h3 class="text-light">🚀 Dashboard</h3>
    <a href="/logout" class="btn btn-danger">Logout</a>
</nav>

<div class="container mt-5">

    <div class="card p-4">
        <h2>Welcome {{user}} 👨‍🚀</h2>

        <button onclick="notify()" class="btn btn-warning mt-3">
            🔔 Show Notification
        </button>

        <h4 class="mt-4">🧠 Fake News Detection</h4>

        <form action="/predict" method="post">
            <input name="text" class="form-control mb-3" placeholder="Enter text">
            <button class="btn btn-primary">Predict</button>
        </form>

        {% if result %}
        <div class="mt-3 p-2 bg-dark text-light rounded">
            {{result}}
        </div>
        {% endif %}
    </div>

</div>

</body>
</html>
